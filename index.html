<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <video id="webcam" playsinline muted></video>
      <div id="controls">
        <button id="start-system" type="button">
          Capture system audio
          <span class="hint">Desktop: Entire screen + system audio</span>
        </button>
        <button id="start-mic" type="button">
          Use microphone
          <span class="hint">Works on phones / other devices</span>
        </button>
      </div>
      <p id="status" aria-live="polite"></p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
